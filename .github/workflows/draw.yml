name: Draw statistics

on:
  workflow_dispatch:
    inputs:
      step:
        description: "inventory | parse | probe"
        default: "inventory"
      states:
        description: "Space-separated state codes (blank = all)"
        default: ""
  push:
    branches: [main]
    paths: ["scripts/draw/**", ".github/workflows/draw.yml"]

permissions:
  contents: write

concurrency:
  group: draw-stats
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install readers
        run: pip install -q pdfplumber openpyxl xlrd requests
      - name: Run
        env:
          STEP: ${{ github.event.inputs.step || '' }}
          STATES: ${{ github.event.inputs.states || '' }}
        run: |
          if [ -z "$STEP" ]; then STEP=$(cat scripts/draw/NEXT_STEP 2>/dev/null || echo inventory); fi
          echo "step=$STEP states=$STATES"
          case "$STEP" in
            inventory) python scripts/draw/inventory.py $STATES ;;
            probe)     python scripts/draw/probe.py $STATES ;;
            parse)     python scripts/draw/parse_all.py $STATES ;;
          esac
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update draw statistics data"
          git pull --rebase origin main
          git push
